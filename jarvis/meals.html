<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ごはん">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<title>ごはん帳</title>
<style>
  /* 画面は /api/meals/ の JSON だけに依存する。別アプリにするときは API を差し替えるだけでよい */
  :root {
    --bg:#fbf6ee; --card:#fff; --card2:#f6efe3; --ink:#3b2f27; --sub:#8a7b6c; --line:#eee4d4;
    --tomato:#e8603c; --tomato-ink:#c94a28; --tomato-soft:#fde8de;
    --herb:#4e9a61; --herb-soft:#e3f1e4; --amber:#d98e27; --amber-soft:#fbefd8; --berry:#c8434e; --berry-soft:#fbe3e4;
    --shadow:0 1px 2px rgba(90,60,30,.05), 0 6px 18px rgba(90,60,30,.07);
    --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
    --r:20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1c1814; --card:#26211c; --card2:#2f2923; --ink:#f3ece2; --sub:#a99a88; --line:#3a332b;
      --tomato:#f27a55; --tomato-ink:#ff9a78; --tomato-soft:#3d2620;
      --herb:#73c287; --herb-soft:#203225; --amber:#efb25a; --amber-soft:#3a2d18; --berry:#ef7a83; --berry-soft:#3d2224;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg:#1c1814; --card:#26211c; --card2:#2f2923; --ink:#f3ece2; --sub:#a99a88; --line:#3a332b;
    --tomato:#f27a55; --tomato-ink:#ff9a78; --tomato-soft:#3d2620;
    --herb:#73c287; --herb-soft:#203225; --amber:#efb25a; --amber-soft:#3a2d18; --berry:#ef7a83; --berry-soft:#3d2224;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px); max-width:640px; margin:0 auto; }
  body.locked { overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--card2); border:1.5px solid transparent;
    border-radius:14px; padding:11px 13px; width:100%; min-width:0; outline:none; transition:border-color .15s, background .15s; }
  input:focus, select:focus, textarea:focus { border-color:var(--tomato); background:var(--card); }
  textarea { resize:none; min-height:84px; line-height:1.6; }
  a { color:var(--tomato-ink); }
  .r { font-family:var(--round); }
  .sub { color:var(--sub); font-size:13px; }
  .row { display:flex; align-items:center; gap:8px; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .grow { flex:1; min-width:0; }

  /* 見出し */
  header.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  header.top .hello { font-family:var(--round); font-weight:700; font-size:22px; line-height:1.25; }
  header.top .date { color:var(--sub); font-size:13px; margin-top:2px; }
  header.top .me { width:42px; height:42px; border-radius:50%; background:var(--card); box-shadow:var(--shadow);
    display:grid; place-items:center; font-size:21px; text-decoration:none; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:26px 2px 10px; }
  .sec h2 { margin:0; font-family:var(--round); font-weight:700; font-size:17px; }
  .sec button, .sec a { color:var(--tomato-ink); font-size:13px; font-weight:600; text-decoration:none; }
  .page-title { font-family:var(--round); font-weight:900; font-size:26px; margin:2px 2px 14px; }

  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; }
  .card + .card { margin-top:12px; }

  /* 予算のカード */
  .hero { background:linear-gradient(150deg, var(--tomato-soft), var(--card) 75%); padding:18px 18px 14px; position:relative; overflow:hidden; }
  .hero .label { font-size:13px; color:var(--sub); font-weight:600; }
  .hero .today { font-family:var(--round); font-weight:900; font-size:44px; line-height:1.05; letter-spacing:-.01em; margin:4px 0 2px; }
  .hero .today small { font-size:17px; font-weight:700; margin-left:2px; }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .pill.good { background:var(--herb-soft); color:var(--herb); }
  .pill.warn { background:var(--amber-soft); color:var(--amber); }
  .pill.bad { background:var(--berry-soft); color:var(--berry); }
  .bar { position:relative; height:12px; border-radius:8px; background:var(--card2); margin:14px 0 8px; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:8px; background:var(--tomato); transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .bar > b { position:absolute; top:-4px; bottom:-4px; width:3px; border-radius:2px; background:var(--ink); opacity:.35; }
  .hero .month { display:flex; justify-content:space-between; font-size:13px; color:var(--sub); }
  .hero .month b { color:var(--ink); font-family:var(--round); font-size:15px; }
  .kinds { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .kinds span { font-size:12px; background:var(--card); border-radius:20px; padding:4px 10px; box-shadow:0 1px 2px rgba(90,60,30,.06); }
  .spark { width:100%; height:54px; display:block; margin-top:10px; }

  /* 横に流れる料理カード */
  .rail { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:2px 16px 8px; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .dish { flex:0 0 152px; scroll-snap-align:start; text-align:left; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:14px 13px 12px; }
  .dish .em { width:54px; height:54px; border-radius:18px; display:grid; place-items:center; font-size:30px; margin-bottom:10px; }
  .dish .nm { font-family:var(--round); font-weight:700; font-size:15px; line-height:1.35; height:2.7em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .dish .meta { font-size:12px; color:var(--sub); margin-top:6px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; margin-top:6px; }
  .tag.good { background:var(--herb-soft); color:var(--herb); }
  .tag.warn { background:var(--amber-soft); color:var(--amber); }
  .tag.bad { background:var(--berry-soft); color:var(--berry); }
  .tag.plain { background:var(--card2); color:var(--sub); }
  .tints > :nth-child(5n+1) .em, .em.t1 { background:#fde8de; } .tints > :nth-child(5n+2) .em, .em.t2 { background:#e3f1e4; }
  .tints > :nth-child(5n+3) .em, .em.t3 { background:#fbefd8; } .tints > :nth-child(5n+4) .em, .em.t4 { background:#e6eefb; }
  .tints > :nth-child(5n+5) .em, .em.t5 { background:#f3e6f6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .em { filter:saturate(.9); }
    :root:not([data-theme="light"]) .tints > * .em { background:var(--card2) !important; } }

  .empty-cta { display:flex; gap:14px; align-items:center; text-align:left; width:100%; }
  .empty-cta .big-em { font-size:34px; width:58px; height:58px; border-radius:18px; background:var(--amber-soft); display:grid; place-items:center; flex:none; }
  .empty-cta b { font-family:var(--round); font-size:16px; display:block; }

  /* 期限が近い */
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:30px; padding:7px 13px 7px 9px;
    box-shadow:var(--shadow); font-size:14px; }
  .chip .d { font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; }

  /* 栄養 */
  .nutri { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .nutri div { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:10px 4px 9px; text-align:center; }
  .nutri .e { font-size:18px; }
  .nutri b { display:block; font-family:var(--round); font-size:19px; line-height:1.2; margin-top:2px; }
  .nutri span { font-size:11px; color:var(--sub); }

  /* リスト */
  .list { list-style:none; margin:0; padding:0; }
  .list > li { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .list > li:first-child { border-top:0; padding-top:2px; }
  .list > li:last-child { padding-bottom:2px; }
  .ic { width:40px; height:40px; border-radius:13px; background:var(--card2); display:grid; place-items:center; font-size:21px; flex:none; }
  .check { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center;
    transition:all .2s; color:transparent; font-size:13px; }
  .check.on { background:var(--herb); border-color:var(--herb); color:#fff; }
  .done-strike { text-decoration:line-through; color:var(--sub); }
  .x { color:var(--sub); font-size:18px; padding:4px 6px; opacity:.6; }
  .addrow { display:flex; gap:8px; margin-top:12px; }
  .addrow button { background:var(--tomato); color:#fff; border-radius:14px; padding:0 16px; font-weight:700; flex:none; white-space:nowrap; }

  /* ボタン */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:16px; padding:12px 18px; font-weight:700;
    background:var(--card2); transition:transform .1s, opacity .2s; }
  .btn:active { transform:scale(.97); }
  .btn.main { background:var(--tomato); color:#fff; box-shadow:0 6px 16px rgba(232,96,60,.28); }
  .btn.herb { background:var(--herb); color:#fff; }
  .btn.wide { width:100%; }
  .btn.small { padding:7px 12px; font-size:13px; border-radius:12px; }
  .btn:disabled { opacity:.55; }

  /* 冷蔵庫 */
  .search { position:relative; }
  .search input { padding-left:40px; background:var(--card); box-shadow:var(--shadow); }
  .search::before { content:"🔍"; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; }
  .seg { display:flex; gap:6px; margin:12px 0 4px; overflow-x:auto; scrollbar-width:none; }
  .seg button { flex:none; padding:7px 14px; border-radius:20px; background:var(--card); box-shadow:var(--shadow); font-size:13px; font-weight:600; color:var(--sub); }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .cat-h { display:flex; align-items:center; gap:6px; font-family:var(--round); font-weight:700; font-size:15px; margin:20px 2px 8px; }
  .cat-h span { color:var(--sub); font-size:12px; font-weight:500; }
  .fresh { height:5px; border-radius:4px; background:var(--card2); margin-top:6px; overflow:hidden; max-width:160px; }
  .fresh i { display:block; height:100%; border-radius:4px; }
  .step { display:flex; align-items:center; background:var(--card2); border-radius:12px; }
  .step button { width:32px; height:32px; font-size:17px; color:var(--sub); }
  .step b { min-width:52px; text-align:center; font-size:13px; font-family:var(--round); }
  .lv { display:flex; background:var(--card2); border-radius:12px; padding:3px; }
  .lv button { padding:5px 9px; font-size:12px; border-radius:9px; color:var(--sub); font-weight:600; }
  .lv button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* レシピ */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rc { text-align:left; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; position:relative; }
  .rc .em { width:60px; height:60px; border-radius:20px; display:grid; place-items:center; font-size:34px; margin-bottom:10px; }
  .rc .nm { font-family:var(--round); font-weight:700; font-size:15px; line-height:1.35; }
  .rc .meta { font-size:12px; color:var(--sub); margin-top:4px; }
  .rc .star { position:absolute; right:12px; top:12px; font-size:18px; color:var(--amber); }
  .importer { display:flex; gap:8px; }
  .importer input { background:var(--card); box-shadow:var(--shadow); }
  .importer button { flex:none; }

  /* 提案 */
  .moods { display:flex; flex-wrap:wrap; gap:8px; }
  .mood { padding:8px 13px; border-radius:20px; background:var(--card); box-shadow:var(--shadow); font-size:14px; transition:all .15s; }
  .mood.on { background:var(--tomato); color:#fff; box-shadow:0 4px 12px rgba(232,96,60,.25); }
  .idea { display:flex; gap:14px; text-align:left; width:100%; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; }
  .idea + .idea { margin-top:10px; }
  .idea .em { width:62px; height:62px; border-radius:20px; display:grid; place-items:center; font-size:34px; flex:none; }
  .idea .nm { font-family:var(--round); font-weight:700; font-size:16px; line-height:1.35; }
  .idea .why { font-size:13px; color:var(--sub); margin-top:2px; }
  .cooking { text-align:center; padding:34px 10px 26px; }
  .cooking .pot { font-size:58px; display:inline-block; animation:bob 1.1s ease-in-out infinite; }
  .cooking .steam { height:26px; font-size:18px; opacity:.6; animation:steam 1.6s ease-in-out infinite; }
  .cooking p { font-family:var(--round); font-weight:700; margin:10px 0 0; }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-4deg); } }
  @keyframes steam { 0% { opacity:0; transform:translateY(8px); } 50% { opacity:.7; } 100% { opacity:0; transform:translateY(-8px); } }

  /* 履歴 */
  .day-h { font-family:var(--round); font-weight:700; font-size:14px; color:var(--sub); margin:20px 4px 8px; }

  /* 下のナビ */
  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:0 12px calc(env(safe-area-inset-bottom) + 8px);
    background:linear-gradient(transparent, var(--bg) 30%); pointer-events:none; }
  nav.tabs .in { pointer-events:auto; max-width:460px; margin:0 auto; background:var(--card); border-radius:26px; box-shadow:0 8px 30px rgba(60,40,20,.14);
    display:flex; align-items:center; justify-content:space-around; height:64px; padding:0 6px; }
  nav.tabs button.t { flex:1; display:flex; flex-direction:column; align-items:center; gap:1px; font-size:10.5px; color:var(--sub); font-weight:600; padding:6px 0; }
  nav.tabs button.t .e { font-size:21px; line-height:1.1; filter:grayscale(1); opacity:.6; transition:all .2s; }
  nav.tabs button.t.on { color:var(--tomato-ink); }
  nav.tabs button.t.on .e { filter:none; opacity:1; transform:translateY(-1px); }
  nav.tabs .fab { width:58px; height:58px; border-radius:50%; background:var(--tomato); color:#fff; font-size:30px; font-weight:300;
    display:grid; place-items:center; box-shadow:0 8px 20px rgba(232,96,60,.4); margin:-26px 6px 0; flex:none; transition:transform .15s; }
  nav.tabs .fab:active { transform:scale(.93); }

  .page { display:none; animation:fade .25s ease; }
  .page.on { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }

  /* 下から出るシート */
  .scrim { position:fixed; inset:0; background:rgba(30,20,10,.38); z-index:40; opacity:0; transition:opacity .25s; }
  .scrim.on { opacity:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:640px; margin:0 auto; background:var(--bg);
    border-radius:26px 26px 0 0; max-height:92vh; overflow-y:auto; overscroll-behavior:contain;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 20px); transform:translateY(102%); transition:transform .32s cubic-bezier(.2,.8,.2,1); }
  .sheet.on { transform:none; }
  .sheet .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }
  .sheet h3 { font-family:var(--round); font-weight:900; font-size:21px; margin:0 0 4px; }
  .sheet .foot { position:sticky; bottom:calc(-20px - env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 22%);
    padding:18px 0 4px; margin-top:8px; display:flex; gap:8px; }
  .action { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:14px; }
  .action + .action { margin-top:10px; }
  .action .ic { width:48px; height:48px; border-radius:16px; font-size:24px; }
  .action b { font-family:var(--round); font-size:16px; display:block; }
  .hero-em { width:84px; height:84px; border-radius:28px; display:grid; place-items:center; font-size:48px; margin:4px auto 12px; }
  .stats3 { display:flex; justify-content:center; gap:18px; color:var(--sub); font-size:13px; margin:6px 0 16px; }
  .stats3 b { color:var(--ink); font-family:var(--round); font-size:16px; display:block; text-align:center; }
  ol.steps { margin:0; padding:0; list-style:none; counter-reset:s; }
  ol.steps li { counter-increment:s; display:flex; gap:12px; padding:8px 0; font-size:14px; }
  ol.steps li::before { content:counter(s); flex:none; width:24px; height:24px; border-radius:50%; background:var(--tomato-soft); color:var(--tomato-ink);
    font-family:var(--round); font-weight:700; font-size:13px; display:grid; place-items:center; margin-top:1px; }
  .ing { display:flex; justify-content:space-between; padding:7px 0; border-top:1px dashed var(--line); font-size:14px; }
  .ing:first-child { border-top:0; }
  .ing .have { color:var(--herb); font-weight:700; font-size:12px; margin-left:6px; }
  .ing .need { color:var(--amber); font-weight:700; font-size:12px; margin-left:6px; }
  .h4 { font-family:var(--round); font-weight:700; font-size:15px; margin:18px 0 6px; }

  /* レシート */
  .scan { position:relative; width:120px; height:160px; margin:10px auto 16px; border-radius:14px; overflow:hidden; background:var(--card2) center/cover; box-shadow:var(--shadow); }
  .scan::after { content:""; position:absolute; left:0; right:0; height:36px; background:linear-gradient(transparent, rgba(232,96,60,.45), transparent);
    animation:scan 1.4s ease-in-out infinite alternate; }
  @keyframes scan { from { top:-36px; } to { top:100%; } }
  .ritem { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; }
  .ritem + .ritem { margin-top:8px; }
  .ritem .top { display:flex; align-items:center; gap:10px; }
  .ritem .edit { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .ritem.open .edit { display:grid; }
  .ritem .edit label { font-size:11px; color:var(--sub); display:block; }
  .ritem .edit input, .ritem .edit select { padding:8px 10px; font-size:14px; }
  .ritem.off { opacity:.6; }
  .switch { position:relative; width:46px; height:28px; border-radius:20px; background:var(--line); flex:none; transition:background .2s; }
  .switch::after { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s; }
  .switch.on { background:var(--herb); }
  .switch.on::after { transform:translateX(18px); }
  .sumline { display:flex; justify-content:space-between; align-items:center; background:var(--card); border-radius:16px; padding:12px 14px; margin:12px 0 0; box-shadow:var(--shadow); }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translate(-50%, 10px); z-index:60;
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:16px; font-size:14px; font-weight:600; opacity:0;
    transition:all .25s; pointer-events:none; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .toast.on { opacity:1; transform:translate(-50%, 0); }
  .spin { display:inline-block; width:15px; height:15px; border:2.2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .skel { background:linear-gradient(90deg, var(--card2), var(--card), var(--card2)); background-size:200% 100%; animation:sk 1.2s linear infinite; border-radius:var(--r); }
  @keyframes sk { to { background-position:-200% 0; } }
  .muted-box { text-align:center; color:var(--sub); font-size:14px; padding:22px 10px; }
  .muted-box .e { font-size:36px; display:block; margin-bottom:6px; }
  .offline { background:var(--amber-soft); color:var(--amber); font-size:13px; font-weight:600; border-radius:14px; padding:10px 14px; margin-bottom:12px; display:none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<script>
// ================= つなぎ（Macでは直接、スマホは JARVIS の中継で Mac に頼む） =================
const API = "/api/meals/";
const RELAY = !["localhost", "127.0.0.1"].includes(location.hostname);
const RELAY_URL = "https://lgjguacnsditdemcnvqy.supabase.co/functions/v1/jarvis";
let relayKey = "";
if (RELAY) {
  try { relayKey = location.hash.slice(1) || localStorage.getItem("jarvis_key") || "";  // JARVIS のスマホ画面と同じ合言葉
    if (location.hash.length > 1) { localStorage.setItem("jarvis_key", relayKey); history.replaceState(null, "", location.pathname); } } catch {}
}
async function relay(action, data) {
  const r = await fetch(`${RELAY_URL}?action=${action}`, data
    ? {method:"POST", headers:{"Content-Type":"application/json", "x-jarvis-key":relayKey}, body:JSON.stringify(data)}
    : {headers:{"x-jarvis-key":relayKey}});
  if (r.status === 403) throw new Error("JARVISの合言葉付きURLで一度開いてください");
  return r.json();
}
async function viaRelay(path, body) {
  const [p, q] = path.split("?");
  const query = Object.fromEntries([...new URLSearchParams(q || "")].map(([k, v]) => [k, [v]]));
  const a = await relay("ask", {kind:"meals", session:"meals", body:{method: body === undefined ? "GET" : "POST", path:p, query, data:body}});
  if (!a.mac) throw new Error("Macが眠っています。Macを起こしてからもう一度どうぞ");
  let after = 0;
  const until = Date.now() + 120000;
  while (Date.now() < until) {
    const {events} = await relay(`events&id=${a.id}&after=${after}`);
    for (const e of events) {
      after = e.id;
      if (e.data.error) throw new Error(e.data.error);
      if ("code" in e.data) {
        if (e.data.code >= 400) throw new Error(e.data.data.error || "エラー");
        return e.data.data;
      }
    }
  }
  throw new Error("時間がかかりすぎたので止めました");
}
async function api(path, body) {
  if (RELAY) return viaRelay(path, body);
  const r = await fetch(API + path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "エラー");
  return d;
}
// 前回の中身をすぐ出し、裏で最新に差し替える（スマホの中継は1往復1秒ほどかかるため）
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("meals:" + k)); localStorage.setItem("meals:" + k, JSON.stringify(v)); } catch { return null; } }
async function load(path, render) {
  const c = store(path);
  if (c) render(c);
  try { const d = await api(path); store(path, d); render(d); $("offline").style.display = "none"; return d; }
  catch (e) { $("offline").textContent = "⚠️ " + e.message; $("offline").style.display = "block"; if (!c) throw e; }
}

// ================= 小物 =================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Math.round(n || 0).toLocaleString();
const CATS = ["肉","魚","野菜","果物","卵・乳製品","豆腐・大豆","主食","調味料","冷凍食品","惣菜・弁当","飲料","菓子","日用品","その他"];
const CAT_EM = {"肉":"🥩","魚":"🐟","野菜":"🥬","果物":"🍎","卵・乳製品":"🥚","豆腐・大豆":"🫘","主食":"🍚","調味料":"🧂","冷凍食品":"🧊",
  "惣菜・弁当":"🍱","飲料":"🥤","菓子":"🍪","日用品":"🧻","その他":"🛒"};
const KIND_EM = {"自炊":"🍳","外食":"🍽️","コンビニ":"🏪"};
const BASICS = ["塩","こしょう","胡椒","醤油","しょうゆ","砂糖","油","サラダ油","水","酒","みりん"];
const daysTo = d => Math.round((new Date(d + "T00:00") - new Date(new Date().toDateString())) / 864e5);
function freshLabel(d) {
  if (!d) return null;
  const n = daysTo(d);
  if (n < 0) return {t:`${-n}日過ぎ`, c:"bad"};
  if (n === 0) return {t:"今日まで", c:"bad"};
  if (n === 1) return {t:"明日まで", c:"warn"};
  if (n === 2) return {t:"あと2日", c:"warn"};
  return {t:`あと${n}日`, c:"good"};
}
const H = [];  // 画面の部品に付ける動き（data-h の番号で呼ぶ）
const on = fn => `data-h="${H.push(fn) - 1}"`;
document.addEventListener("click", e => {
  const h = e.target.closest("[data-h]"); if (h) { H[+h.dataset.h](h, e); return; }
  const g = e.target.closest("[data-go]"); if (g) show(g.dataset.go);
});
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
async function busy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label}`;
  try { return await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; btn.innerHTML = old; }
}
const buzz = () => { try { if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(12); } catch {} };

// シート（下から出る画面）
function openSheet(html, keepScroll) {
  const y = $("sheet").scrollTop;
  $("sheet-body").innerHTML = html;
  $("sheet").scrollTop = keepScroll ? y : 0;
  $("scrim").style.display = "block";
  void $("sheet").offsetWidth;  // 一度描いてから動かす（rAF は裏のタブで止まるので使わない）
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  document.body.classList.add("locked");
}
function closeSheet() {
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); document.body.classList.remove("locked");
  setTimeout(() => { if (!$("sheet").classList.contains("on")) $("scrim").style.display = "none"; }, 300);
}
$("scrim").onclick = closeSheet;
function ask(title, text, okLabel = "消す") {
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><p class="sub" style="margin:4px 0 0">${esc(text)}</p>
      <div class="foot"><button class="btn wide" ${on(() => { closeSheet(); res(false); })}>やめる</button>
      <button class="btn wide main" style="background:var(--berry);box-shadow:none" ${on(() => { closeSheet(); res(true); })}>${esc(okLabel)}</button></div>`);
  });
}

// ================= 画面の切り替え =================
const loaders = { home: loadHome, fridge: loadFridge, recipe: loadRecipes, idea: () => {}, history: loadHistory };
function show(p) {
  document.querySelectorAll("nav button.t").forEach(b => b.classList.toggle("on", b.dataset.go === p));
  document.querySelectorAll(".page").forEach(s => s.classList.toggle("on", s.id === "p-" + p));
  try { sessionStorage.setItem("meals-tab", p); } catch {}
  scrollTo(0, 0);
  Promise.resolve(loaders[p]()).catch(e => toast(e.message));
}

// ================= ホーム =================
let S = null;
async function loadHome() { await load("summary", renderHome); }
function renderHome(s) {
  S = s;
  const m = s.month, day = new Date().getDate(), pace = m.budget * day / m.days_in_month;
  const st = m.left < 0 ? ["bad", "予算オーバー"] : m.food <= pace ? ["good", "いいペース"] : m.food <= pace * 1.15 ? ["warn", "ちょっと多め"] : ["bad", "使いすぎ注意"];
  const todayLeft = Math.max(0, m.today_left);
  $("hero").innerHTML = `
    <div class="between"><span class="label">今日つかえるのは</span><span class="pill ${st[0]}">${st[1]}</span></div>
    <div class="today">${yen(todayLeft).replace("¥", "<small>¥</small>")}</div>
    <div class="sub">今日 ${yen(m.today_spent)} 使用・明日からは1日 ${yen(m.days_left > 1 ? m.left / (m.days_left - 1) : m.left)}</div>
    <div class="bar"><i style="width:${Math.min(100, m.food / m.budget * 100)}%;${st[0] === "bad" ? "background:var(--berry)" : ""}"></i>
      <b style="left:${Math.min(100, pace / m.budget * 100)}%" title="今日までの目安"></b></div>
    <div class="month"><span>今月 <b>${yen(m.food)}</b> / ${yen(m.budget)}</span><span>のこり <b>${yen(m.left)}</b></span></div>
    ${spark(m)}
    <div class="kinds">${Object.entries(m.by_kind).map(([k, v]) => `<span>${KIND_EM[k]} ${k} ${yen(v)}</span>`).join("")}</div>`;

  // 今夜のおすすめ
  const sg = s.suggest_last;
  if (sg && sg.ideas && sg.ideas.length) {
    const age = Math.round((Date.now() - new Date(sg.at)) / 36e5);
    $("tonight").innerHTML = `<div class="rail tints">${sg.ideas.map(x => dishCard(x)).join("")}</div>
      <div class="sub" style="margin:2px 4px 0">${esc(sg.message)}${age >= 6 ? `（${age < 24 ? age + "時間" : Math.round(age / 24) + "日"}前の提案）` : ""}</div>`;
  } else {
    $("tonight").innerHTML = `<button class="card empty-cta" data-go="idea"><span class="big-em">🍲</span>
      <span><b>冷蔵庫から献立を考える</b><span class="sub">期限・予算・栄養を見て、作れるものを提案します</span></span></button>`;
  }

  // 期限が近い
  $("soon-wrap").style.display = s.expiring.length ? "" : "none";
  $("soon").innerHTML = s.expiring.map(i => { const f = freshLabel(i.expires);
    return `<span class="chip">${esc(i.name)}<span class="d tag ${f.c}" style="margin:0">${f.t}</span></span>`; }).join("");

  const w = s.week;
  $("nutri").innerHTML = [["🔥", w.kcal, "kcal"], ["💪", w.p, "たんぱく質g"], ["🧈", w.f, "脂質g"], ["🍚", w.c, "炭水化物g"]]
    .map(([e, v, l]) => `<div><span class="e">${e}</span><b>${w.meals ? v : "–"}</b><span>${l}</span></div>`).join("");

  renderShop(s.shopping);
  loadRecent();
}
function spark(m) {
  const W = 300, Hh = 50, n = m.days_in_month, top = Math.max(m.budget, m.food) * 1.05;
  const x = d => (d / n) * W, y = v => Hh - (v / top) * Hh;
  const pts = m.series.map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 -4 ${W} ${Hh + 8}" preserveAspectRatio="none" aria-label="今月の食費の推移">
    <line x1="0" y1="${Hh}" x2="${W}" y2="${y(m.budget)}" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline points="0,${Hh} ${pts}" fill="none" stroke="var(--tomato)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(m.series.length)}" cy="${y(m.food)}" r="4" fill="var(--tomato)"/></svg>
    <div class="between sub" style="font-size:11px;margin-top:-2px"><span>1日</span><span>--- 予算のペース</span><span>${n}日</span></div>`;
}
function dishCard(x) {
  const tag = x.missing.length ? `<span class="tag plain">買い足し ${x.missing.length}品</span>` : `<span class="tag good">今ある材料で</span>`;
  return `<button class="dish" ${on(() => ideaSheet(x))}><div class="em">${esc(x.emoji || "🍽️")}</div>
    <div class="nm">${esc(x.name)}</div><div class="meta">⏱ ${x.minutes || "–"}分・1人 ${yen(x.cost_per_serving)}</div>${tag}</button>`;
}
function renderShop(list) {
  $("shop-n").textContent = list.length ? `${list.length}品` : "";
  $("shop").innerHTML = list.length ? list.map(x => `<li>
      <button class="check" ${on(async el => { el.classList.add("on"); buzz(); el.nextElementSibling.classList.add("done-strike");
        await api("update", {table:"shopping", id:x.id, fields:{done:1}}); setTimeout(loadHome, 400); })}>✓</button>
      <span class="grow">${esc(x.name)}${x.note ? `<span class="sub">　${esc(x.note)}</span>` : ""}</span></li>`).join("")
    : `<li class="sub" style="justify-content:center">いまは空です 🛒</li>`;
}
async function addShop() {
  const names = $("shop-in").value.split(/[、,，\s]+/).filter(Boolean);
  if (!names.length) return;
  $("shop-in").value = "";
  renderShop(await api("shopping_add", {names})); buzz();
}
$("shop-add").onclick = addShop;
$("shop-in").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) addShop(); };

async function loadRecent() {
  const [ms, ps] = await Promise.all([api("meals?days=7"), api("purchases")]);
  const items = timeline(ms, ps).slice(0, 4);
  $("recent").innerHTML = items.length ? items.map(timelineRow).join("")
    : `<li class="sub" style="justify-content:center">右下の ＋ から、レシートやごはんを記録できます</li>`;
}
function timeline(ms, ps) {
  return [...ms.map(m => ({t:"meal", d:m.date, k:m.created, o:m})), ...ps.map(p => ({t:"buy", d:p.date, k:p.created, o:p}))]
    .sort((a, b) => (b.d + b.k).localeCompare(a.d + a.k));
}
function timelineRow(it) {
  const o = it.o;
  if (it.t === "meal") return `<li><span class="ic">${esc(o.emoji || KIND_EM[o.kind] || "🍽️")}</span>
    <span class="grow"><b style="font-weight:600">${esc(o.name)}</b><br><span class="sub">${o.slot ? esc(o.slot) + "・" : ""}${Math.round(o.kcal || 0)}kcal・たんぱく質${Math.round(o.p || 0)}g${o.cost ? "・原価" + yen(o.cost) : ""}</span></span>
    <button class="x" ${on(async () => { if (await ask("この食事の記録を消しますか？", o.name)) { await api("delete", {table:"meals", id:o.id}); refresh(); } })}>×</button></li>`;
  return `<li><span class="ic">${KIND_EM[o.kind] || "🧾"}</span>
    <span class="grow"><b style="font-weight:600">${esc(o.store || "買い物")}</b><br><span class="sub">${esc(o.kind)}・食費 ${yen(o.food_total)}${o.total !== o.food_total ? `（合計 ${yen(o.total)}）` : ""}</span></span>
    <button class="x" ${on(async () => { if (await ask("この買い物を消しますか？", "ここから冷蔵庫に入った食材も一緒に消えます。")) { await api("delete", {table:"purchases", id:o.id}); refresh(); } })}>×</button></li>`;
}
function refresh() { const p = document.querySelector(".page.on").id.slice(2); loaders[p](); }

// ================= 履歴 =================
async function loadHistory() {
  const [ms, ps] = await Promise.all([api("meals?days=60"), api("purchases")]);
  const groups = {};
  timeline(ms, ps).forEach(it => (groups[it.d.slice(0, 10)] ||= []).push(it));
  const label = d => { const n = -daysTo(d); return n === 0 ? "今日" : n === 1 ? "昨日" :
    new Date(d + "T00:00").toLocaleDateString("ja-JP", {month:"long", day:"numeric", weekday:"short"}); };
  $("history").innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([d, its]) =>
    `<div class="day-h">${label(d)}</div><div class="card"><ul class="list">${its.map(timelineRow).join("")}</ul></div>`).join("")
    : `<div class="muted-box"><span class="e">📝</span>まだ記録がありません</div>`;
}

// ================= ＋ ボタン（記録） =================
$("fab").onclick = () => {
  buzz();
  const s = S || {favorites:[], recent:[]};
  const quick = [...s.favorites.map(r => ({e:r.emoji || "⭐", t:`${r.name}を作った`})),
                 ...s.recent.filter(r => !s.favorites.some(f => f.name === r.name)).map(r => ({e:r.emoji || "🍳", t:`${r.name}を作った`}))].slice(0, 8);
  openSheet(`<h3>なにを記録する？</h3><p class="sub" style="margin:0 0 16px">作ったもの・食べたもの・買ったもの</p>
    <button class="action" ${on(() => { closeSheet(); $("camera").click(); })}><span class="ic" style="background:var(--tomato-soft)">📷</span>
      <span><b>レシートを撮る</b><span class="sub">食費と冷蔵庫の中身がまとめて入ります</span></span></button>
    <div class="card" style="margin-top:10px">
      <b class="r" style="font-size:16px">✍️ ひとことで記録</b>
      <textarea id="rec-in" style="margin-top:10px" placeholder="例）豚キムチ2人分作った&#10;昼にコンビニでおにぎり2個 300円&#10;外食でラーメン 950円"></textarea>
      <div class="chips" style="margin-top:10px">
        ${quick.map(q => `<button class="chip" style="font-size:13px" ${on(() => { $("rec-in").value = q.t; $("rec-in").focus(); })}>${esc(q.e)} ${esc(q.t)}</button>`).join("")}
        <button class="chip" style="font-size:13px" ${on(() => { $("rec-in").value = "外食で 円"; $("rec-in").focus(); })}>🍽️ 外食した</button>
        <button class="chip" style="font-size:13px" ${on(() => { $("rec-in").value = "コンビニで 円"; $("rec-in").focus(); })}>🏪 コンビニ</button>

let draft = null;
function shrink(file) {  // 送る前に縮める（長辺1600px・JPEG）
  return new Promise((ok, ng) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", .85));
    };
    img.onerror = () => ng(new Error("画像を読めませんでした"));
    img.src = URL.createObjectURL(file);
  });
}
$("camera").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  let url;
  try { url = await shrink(f); } catch (err) { return toast(err.message); }

function renderFridge() {
  const q = $("f-q").value.trim();
  let inv = INV.filter(i => !q || i.name.includes(q));
  if (fFilter === "soon") inv = inv.filter(i => i.expires && daysTo(i.expires) <= 2);
  if (fFilter === "low") inv = inv.filter(i => i.status === "少ない");
  if (!INV.length) { $("fridge").innerHTML = `<div class="muted-box"><span class="e">🧊</span>冷蔵庫は空です<br>レシートを撮ると、ここに食材が並びます</div>`; return; }
  if (!inv.length) { $("fridge").innerHTML = `<div class="muted-box">当てはまる食材はありません</div>`; return; }
  const groups = {};
  inv.forEach(i => (groups[i.category] ||= []).push(i));

function itemRow(i) {
  const f = freshLabel(i.expires);
  let bar = "";
  if (i.expires) {
    const total = Math.max(1, (new Date(i.expires) - new Date(i.created.slice(0, 10))) / 864e5);
    const frac = Math.max(.04, Math.min(1, daysTo(i.expires) / total));
    bar = `<div class="fresh"><i style="width:${frac * 100}%;background:var(--${f.c === "good" ? "herb" : f.c === "warn" ? "amber" : "berry"})"></i></div>`;
  }
  const step = i.qty >= 50 ? 50 : 1;
  const ctl = i.qty != null
    ? `<div class="step"><button ${on(() => setQty(i, -step))}>−</button><b>${+(+i.qty).toFixed(1)}${esc(i.unit)}</b><button ${on(() => setQty(i, step))}>＋</button></div>`
    : `<div class="lv">${["ある","少ない","なし"].map(s => `<button class="${i.status === s ? "on" : ""}" ${on(() => setLevel(i, s))}>${s}</button>`).join("")}</div>`;
  return `<li><span class="grow"><span style="font-weight:600">${esc(i.name)}</span>
    ${f ? `<span class="tag ${f.c}" style="margin:0 0 0 6px">${f.t}</span>` : ""}${bar}
    ${i.unit_price && i.qty ? `<span class="sub" style="font-size:11px">${yen(i.unit_price * i.qty)}分</span>` : ""}</span>${ctl}</li>`;

async function setQty(i, d) {

  const h = new Date().getHours();
  $("hello").textContent = (h < 5 ? "こんばんは" : h < 11 ? "おはようございます" : h < 17 ? "こんにちは" : "こんばんは") + "、迦一さん";
  $("date").textContent = new Date().toLocaleDateString("ja-JP", {month:"long", day:"numeric", weekday:"long"});
  let first = "home";
  try { first = sessionStorage.getItem("meals-tab") || "home"; } catch {}
  show(loaders[first] ? first : "home");
})();
</script>
</body>
</html>
